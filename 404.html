<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Outside the circle | Erata</title>
  <meta name="theme-color" content="#0b0b0a">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    .error-page { min-height: 100vh;
      min-height: 100svh; background: var(--ink); color: var(--paper); display: flex; flex-direction: column; padding: 1.5rem var(--gutter); }
    .error-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 1rem; border-bottom: 1px solid var(--paper-line); }
    .error-head .brand-mark { width: 27px; height: 35px; }
    .error-main { flex: 1; display: flex; align-items: center; padding: clamp(4rem, 10vw, 8rem) 0; position: relative; overflow: hidden; }
    .error-inner { width: 100%; max-width: var(--max); margin: 0 auto; }
    .error-page .eyebrow { margin-bottom: 2rem; }
    .error-page .eyebrow span { color: var(--accent-on-dark); }
    .error-title { max-width: 9ch; font-size: clamp(4rem, 12vw, 11rem); font-weight: 500; line-height: .82; letter-spacing: -.07em; }
    .error-title em { font-family: var(--serif); font-weight: 400; }
    .error-copy { max-width: 38ch; margin-top: 2.5rem; color: var(--paper-muted); font-size: 1rem; line-height: 1.5; }
    .error-actions { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; margin-top: 2.5rem; }
    .error-actions .button { border-color: var(--paper); color: var(--paper); }
    .error-actions .button:hover { border-color: var(--accent-on-dark); background: var(--accent-on-dark); color: var(--ink); }
    .error-actions .text-link { color: var(--paper); border-color: var(--paper-line-strong); }
    .error-actions .text-link:hover { color: var(--accent-on-dark); border-color: var(--accent-on-dark); }
    .error-ring { position: absolute; right: -8vw; bottom: -22vw; width: min(54vw, 700px); aspect-ratio: 1; border: 1px solid var(--paper-line); border-radius: 50%; pointer-events: none; }
    .error-ring::after { content: ""; position: absolute; left: 50%; bottom: -13%; width: clamp(10px, 1.2vw, 16px); aspect-ratio: 1; border-radius: 50%; background: var(--paper); transform: translateX(-50%); }
    .error-foot { display: flex; justify-content: space-between; gap: 1rem; padding-top: 1rem; border-top: 1px solid var(--paper-line); color: var(--paper-muted); font-family: var(--mono); font-size: .58rem; letter-spacing: .04em; text-transform: uppercase; }
    @media (max-width: 620px) {
      .error-page { padding-top: 1rem; }
      .error-title { font-size: clamp(3.6rem, 18vw, 6rem); }
      .error-copy { margin-top: 2rem; }
      .error-actions { align-items: flex-start; flex-direction: column; gap: 1rem; }
      .error-ring { width: 72vw; right: -25vw; bottom: -8vw; }
      .error-foot { align-items: flex-start; flex-direction: column; gap: .35rem; }
    }
  </style>
</head>
<body class="error-page">
  <header class="error-head">
    <a class="brand" href="/" aria-label="Erata, home">
      <span class="mark brand-mark" aria-hidden="true"></span>
    </a>
    <p class="micro-label">404 / Signal lost</p>
  </header>

  <main class="error-main">
    <div class="error-inner">
      <p class="eyebrow"><span>404</span> Outside the frame</p>
      <h1 class="error-title">Outside <em>the circle.</em></h1>
      <p class="error-copy">This page does not exist, or it has moved out of frame. The sound is still where it should be.</p>
      <div class="error-actions">
        <a class="button" href="/">Return home</a>
        <a class="text-link" href="/#listen">Listen <span aria-hidden="true">→</span></a>
      </div>
      <span class="error-ring" aria-hidden="true"></span>
    </div>
  </main>

  <footer class="error-foot">
    <span>Erata / Ankara, Turkey</span>
    <span>erataofficial.art</span>
  </footer>
</body>
</html>
